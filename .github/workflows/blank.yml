
name: Descomprimir y generar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "No se encontró ningún archivo ZIP"
            exit 1
          fi

          mkdir -p proyecto
          unzip -o "$ZIP" -d proyecto

          if [ -f proyecto/package.json ]; then
            cp -a proyecto/. .
          else
            DIR=$(find proyecto -name package.json -printf '%h\n' | head -n 1)
            if [ -z "$DIR" ]; then
              echo "No se encontró package.json"
              exit 1
            fi
            cp -a "$DIR"/. .
          fi

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Capacitor
        run: |
          npm install --no-save \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      - name: Configurar Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.camilajazmin.app",
            "appName": "Camila Jazmin",
            "webDir": "out"
          }
          EOF

      - name: Configurar exportación Next.js
        run: |
          node -e "
          const fs = require('fs');
          const p = 'next.config.mjs';
          let s = fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
          if (!s.includes('output:')) {
            s = s.replace(
              /const nextConfig = \{/,
              'const nextConfig = { output: \"export\",'
            );
            fs.writeFileSync(p, s);
          }
          "

      - name: Compilar Next.js
        run: npx next build

      - name: Crear Android
        run: npx cap add android

      - name: Sincronizar
        run: npx cap sync android

      - name: Generar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Camila-Jazmin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
